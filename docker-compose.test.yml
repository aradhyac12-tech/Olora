services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wcim_test
      POSTGRES_PASSWORD: wcim_test_password
      POSTGRES_DB: wcim_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wcim_test -d wcim_test"]
      interval: 2s
      timeout: 3s
      retries: 20
